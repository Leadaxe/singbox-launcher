name: Update Homebrew Cask

# Releases published by CI/CD use GITHUB_TOKEN, so `release.published`
# does not reliably trigger a second workflow. Reconcile after successful
# CI/CD push runs and daily as a fallback.
"on":
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
  schedule:
    - cron: "21 5 * * *"
  workflow_dispatch:

# No PR permission needed: this workflow updates the Cask directly on main.
permissions:
  contents: write

concurrency:
  group: update-homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refresh Cask from latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-homebrew-cask.sh

      - name: Verify Cask and release archive
        shell: bash
        run: |
          set -euo pipefail
          ruby -c Casks/singbox-launcher.rb
          bash -n scripts/update-homebrew-cask.sh

          if git diff --quiet -- Casks/singbox-launcher.rb; then
            echo "Cask is already up to date"
            exit 0
          fi

          version="$(sed -nE 's/^  version "([^"]+)"$/\1/p' Casks/singbox-launcher.rb)"
          checksum="$(sed -nE 's/^  sha256 "([0-9a-f]{64})"$/\1/p' Casks/singbox-launcher.rb)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid version or checksum in Cask" >&2
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          archive="$tmp_dir/singbox-launcher.zip"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/Leadaxe/singbox-launcher/releases/download/v${version}/singbox-launcher-v${version}-macos.zip" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check
          unzip -p "$archive" "artifacts-darwin/singbox-launcher.app/Contents/Info.plist" >/dev/null
          echo "Release checksum and app bundle verified"

      - name: Commit and push Cask to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/singbox-launcher.rb; then
            echo "Nothing to commit"
            exit 0
          fi

          version="$(sed -nE 's/^  version "([^"]+)"$/\1/p' Casks/singbox-launcher.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/singbox-launcher.rb
          git commit -m "chore(homebrew): update Cask to v${version}"
          # No force push: a concurrent maintainer commit causes a safe failure.
          # The scheduled run will retry against the newer default branch.
          git push origin HEAD:main
